# [ADDED 2026-10-28] Hardware-free regression checks; never opens a robot bus.
name: HX5 offline hand and driver checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  hx5-offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile modified Python sources without importing ROS or touching hardware
        run: python -m compileall -q hardware
      - name: Install trace test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Run hand input, bounded-read overlay and trace unit tests
        run: |
          python -m unittest -v \
            hardware.test_controller_hand_motion \
            hardware.test_hand_write_rate \
            hardware.test_hand_trace
