name: SH5 four-way integration gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/sh5-four-fixes-20261028]

jobs:
  offline-integrated-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check all Python source without ROS or hardware
        run: python -m compileall -q hardware robotis_vuer
      - name: Verify PR1-4 coexistence and installation inventory
        run: |
          python -m unittest -v \
            hardware.test_four_way_integration \
            hardware.test_ready_recovery \
            hardware.test_controller_stick_motion
